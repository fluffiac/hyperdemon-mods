# waves.cfg: run rules for the `waves` mod. Reference: docs/WAVES_FORMAT.md
#
# Edits apply when the file is saved (or F8). Table changes apply from the
# next run; everything else at once. F7 shows a status panel in the run.
# Leave a setting out to keep the game's behaviour.

# Arena radius for runs (game: 48; the lobby is 15).
# arena radius 48

# off: the arena keeps its full size (the game shrinks it by up to 22 as
# gems are collected).
# arena shrink on

# New waves wait while this many enemies are alive. 0 = no cap.
# enemy cap 0

# Also start the next wave every N seconds. 0 = only when wave enemies die.
# wave every 0

# Powerups: mercury (game: from 15 s, stays 10 s) and sulfur (from 30 s,
# stays 5 s). The game brings them out as gems are collected.
#   powerup <mercury|sulfur> game | off | every <s> [after <s>] | lasts <s>
# powerup mercury game
# powerup sulfur game

# The spawn table: one `wave` line per wave, in order. This is the game's
# own table. A wave starts when an enemy from an earlier wave dies, and its
# enemies spawn together. Enemies:
#   owl (ENEMY 1), trilo (ENEMY 2), snake (ENEMY 3), spider (ENEMY 4),
#   centipede, boss (the owl boss), and the variants trilo_boss, snake_boss,
#   spider_boss, centipede_boss, centipede_2, the skulls skull (1 HP),
#   skull2 (10 HP), skull3 (100 HP), or type:<n>. Skull deaths do not start
#   the next wave.
# Each enemy can take a spawn point and the boss a starting phase:
#   owl@10,-20      at x 10, z -20 (the arena centre is 0,0; radius 48)
#   boss@0,30,0     at x 0, height 30, z 0 (the boss's own spot)
#   boss:3          the boss starts at phase 3 (0 dormant .. 5 last)
#   boss:2@0,-15    both
# The centipede picks its own spot. `wave none` is an empty wave. Delete
# every `wave` line to use the game's table whatever it is.
wave owl                    # 1
wave trilo snake            # 2
wave spider                 # 3
wave owl                    # 4
