[workspace]
resolver = "2"
members = ["crates/hd-sdk", "crates/hd-loader", "mods/example", "mods/tutorials", "mods/waves", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
hd-sdk = { path = "crates/hd-sdk" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Kernel",
] }

[profile.release]
lto = "thin"
debug = 1
